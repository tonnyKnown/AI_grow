name: 缺陷报告
description: 报告 Bug。请提供可复现的步骤。
title: "[修复] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 缺陷报告

        > 报告前请先搜索是否已有相同 Issue。

  - type: checkboxes
    id: scope
    attributes:
      label: 影响模块
      options:
        - label: 网关 gateway
        - label: 系统服务 system-service
        - label: 业务服务 business-service
        - label: AI 服务 javachain
        - label: 前端 oa-frontend

  - type: input
    id: env
    attributes:
      label: 环境
      description: 在哪个环境发现的？
      placeholder: 本地 / 测试 / 预发 / 生产
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 严重级别
      options:
        - 致命（系统不可用）
        - 严重（主流程中断）
        - 一般（次要功能异常）
        - 轻微（文案/样式）
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好，包含角色、参数、操作顺序
      placeholder: |
        1. 以管理员登录
        2. 进入「商品管理」
        3. 输入 xxx 后点击查询
        4. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 附上接口返回值、报错日志、截图（脱敏后）
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 接口响应 / 日志片段 / 截图 / SQL 结果
      placeholder: |
        ```
        curl -X POST http://localhost:8080/api/system/auth/login ...
        ```
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 影响哪些用户/功能？是否影响已有数据？是否需要数据修复？
      value: |
        - [ ] 是否影响已有数据：
        - [ ] 是否需要数据修复脚本：
        - [ ] 是否需回滚：
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 其他可能有帮助的信息（版本号、浏览器、相关 Issue/PR）
    validations:
      required: false
